<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘钻头</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a12;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* 背景光斑 */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    animation: float 8s ease-in-out infinite;
  }
  .blob-1 {
    width: 400px; height: 400px;
    background: #00ffcc;
    top: -100px; left: -100px;
  }
  .blob-2 {
    width: 350px; height: 350px;
    background: #ff66cc;
    bottom: -80px; right: -80px;
    animation-delay: -3s;
  }
  .blob-3 {
    width: 300px; height: 300px;
    background: #9966ff;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -5s;
    opacity: 0.3;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  /* 主卡片 */
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 50px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    max-width: 420px;
    width: 90%;
  }

  /* 头像占位 */
  .avatar {
    width: 100px; height: 100px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ffcc, #9966ff, #ff66cc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
    color: #0a0a12;
  }

  h1 {
    font-size: 36px;
    color: #fff;
    margin-bottom: 8px;
    letter-spacing: 4px;
  }

  .subtitle {
    color: #00ffcc;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 32px;
    opacity: 0.9;
  }

  .info-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    margin-bottom: 12px;
    transition: all 0.3s;
  }
  .info-row:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
  }

  .info-row .icon { font-size: 20px; }
  .info-row .label { color: #888; font-size: 13px; }
  .info-row .value { color: #fff; font-size: 15px; font-weight: 500; }

  .tag {
    display: inline-block;
    padding: 6px 16px;
    background: linear-gradient(135deg, rgba(0,255,204,0.2), rgba(255,102,204,0.2));
    border: 1px solid rgba(0,255,204,0.3);
    border-radius: 20px;
    color: #00ffcc;
    font-size: 13px;
    margin-top: 20px;
  }

  footer {
    position: absolute;
    bottom: 20px;
    color: #555;
    font-size: 12px;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="card">
  <div class="avatar">钻</div>
  <h1>神秘钻头</h1>
  <div class="subtitle">◆ VOCALOID FAN ◆</div>

  <div class="info-row">
    <span class="icon">🎵</span>
    <span class="label">爱好</span>
    <span class="value">术力口</span>
  </div>

  <div class="info-row">
    <span class="icon">📱</span>
    <span class="label">抖音</span>
    <span class="value">douyin_xiaoq</span>
  </div>

  <div class="tag">♪ 每天在听术曲 ♪</div>
</div>

<footer>© 神秘钻头 · Powered by Cloudflare Pages</footer>

</body>
</html>
